<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About | Wellesley Consulting Club</title>
<meta name="description" content="Wellesley Consulting Club: a student-run consulting organization.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="site.js" defer></script>
</head>
<body>
<!--
  HOW TO EDIT THIS PAGE
  - Text: type inside any empty tag, e.g. <p data-ph="Add text"></p>  ->  <p>Your words</p>
  - Photos: put an image inside an empty photo box:
      <div class="photo" data-ph="Add photo"></div>
      ->  <div class="photo"><img src="images/your-photo.jpg" alt="Short description"></div>
  - Empty boxes show a dashed "Add ..." hint; they disappear once filled.
  - Header, footer, email and social links are set once in site.js.
-->
<div id="site-header"></div>
<main>

<!--
  MOVING SECTIONS: each section sits between a "START" and "END" comment.
  Cut everything from START to END and paste it where you want it.
  Backgrounds alternate (white / cream) automatically, whatever the order.
-->

  <!-- ============ START: Banner ============ -->
  <section class="banner banner--page">
    <!-- Optional background photo: <div class="banner-bg"><img src="images/your-photo.jpg" alt=""></div> -->
    <div class="banner-bg"></div>
    <div class="ring" data-logo="navy"></div>
    <div class="wrap">
      <h1>About</h1>
      <p class="lede" data-ph="Add a short intro"></p>
    </div>
  </section>
  <!-- ============ END: Banner ============ -->

  <!-- ============ START: Our mission ============ -->
  <!-- ===== Mission ===== -->
  <section class="section">
    <div class="wrap split">
      <div class="photo" data-ph="Add photo"></div>
      <div class="stack">
        <h2>Our mission</h2>
        <p class="muted" data-ph="Add your mission"></p>
      </div>
    </div>
  </section>
  <!-- ============ END: Our mission ============ -->

  <!-- ============ START: Executive board ============ -->
  <!-- ===== Executive board: copy a <div class="person"> block to add someone ===== -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>Executive board</h2>
        <p class="muted" data-ph="Add text"></p>
      </div>
      <div class="people">
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">President</span>
        </div>
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">Vice President</span>
        </div>
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">Director of Client Relations</span>
        </div>
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">Director of Events</span>
        </div>
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">Director of Recruitment</span>
        </div>
        <div class="person">
          <div class="photo photo--tall" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role">Treasurer</span>
        </div>
      </div>
    </div>
  </section>
  <!-- ============ END: Executive board ============ -->

  <!-- ============ START: Case team ============ -->
  <!-- ===== Case team ===== -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>Case team</h2>
        <p class="muted" data-ph="Add a line about the case team"></p>
      </div>
      <div class="people people--small">
        <div class="person">
          <div class="photo photo--square" data-ph="Add photo"></div>

          <span class="person-role" data-ph="Role"></span>
        </div>
        <div class="person">
          <div class="photo photo--square" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role" data-ph="Role"></span>
        </div>
        <div class="person">
          <div class="photo photo--square" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role" data-ph="Role"></span>
        </div>
        <div class="person">
          <div class="photo photo--square" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>

        </div>

          <span class="person-role" data-ph="Role"></span>
        </div>
        <div class="person">
          <div class="photo photo--square" data-ph="Add photo"></div>
          <h3 data-ph="Name"></h3>
          <span class="person-role" data-ph="Role"></span>
        </div>
      </div>
    </div>
  </section>

    <div class="wrap">
      <div class="section-head">
        <h2>Life at WCC</h2>
        <p class="muted" data-ph="Add a line about the WCC community"></p>

      <div class="mosaic">

<div id="site-footer"></div>
